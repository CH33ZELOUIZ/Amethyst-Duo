# Builds an unsigned (ldid fake-signed) IPA with the iOS 27.1+ SDK and publishes a GitHub Release.
# Does NOT touch altstore/source.json.
name: Duo build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '8'
          architecture: aarch64
      - name: Build tools
        run: brew install cmake ldid wget make
      - name: Stamp version
        run: |
          V="1.0.${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $V" Natives/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Natives/Info.plist
      - name: Build IPA
        run: |
          export PATH="$(brew --prefix)/opt/make/libexec/gnubin:$(brew --prefix)/bin:$PATH"
          xcodebuild -version
          gmake -j"$(sysctl -n hw.ncpu)" package PLATFORM=2 BOOTJDK="$JAVA_HOME/bin"
          ls -la artifacts
          git restore Natives/Info.plist
      - name: Verify fold code was compiled in
        run: |
          APP=$(ls -d artifacts/Payload/*.app | head -1)
          echo "APP=$APP"; ls "$APP" | head -30
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$APP/Info.plist")"
          echo "hinge symbol hits:"; strings "$BIN" | grep -c -E "UIHingeInteraction|divisionRegionKind"
      - name: Publish release (IPA only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IPA=$(ls artifacts/*.ipa | head -1)
          TAG="duo-${{ github.run_number }}"
          NEW="artifacts/Amethyst-Duo-${{ github.run_number }}.ipa"
          cp "$IPA" "$NEW"
          SIZE=$(stat -f%z "$NEW")
          SHA=$(shasum -a 256 "$NEW" | cut -d' ' -f1)
          # A retry may use a tag whose release was created before a later source push failed.
          # Preserve that release and replace only this run's deterministic asset.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$NEW" --clobber
          else
            gh release create "$TAG" "$NEW" --title "Amethyst Duo build $TAG" --notes "Fold-aware Amethyst for iPhone Duo. Unsigned IPA: sign with SideStore/AltStore." --target "${{ github.sha }}"
          fi
          echo "SIZE=$SIZE SHA=$SHA"
